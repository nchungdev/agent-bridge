name: Release
# A build only happens when a release tag is pushed on purpose (use ~/ab-release.sh, or by hand):
#   v1.0.1       version 1.0.1, build 01
#   v1.0.1-b02   a hotfix build of 1.0.1 ... up to -b99; after that tag the next patch (v1.0.2)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Tag must be vX.Y.Z or vX.Y.Z-bNN (NN from 02 to 99)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-b([0-9]{2}))?$ ]]; then
            echo "::error::tag '$tag' is not vX.Y.Z or vX.Y.Z-bNN"
            exit 1
          fi
          if [ -n "${BASH_REMATCH[2]}" ]; then
            n=$((10#${BASH_REMATCH[2]}))
            if [ "$n" -lt 2 ] || [ "$n" -gt 99 ]; then
              echo "::error::build must be 02..99 (the plain tag is build 01; after build 99 tag the next patch version)"
              exit 1
            fi
          fi

  web:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  binaries:
    needs: web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # no windows: the terminal needs a Unix PTY (github.com/creack/pty)
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          name="agent-bridge_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          go build -ldflags="-w -s -X github.com/nchungdev/agent-bridge/internal/version.Version=${GITHUB_REF_NAME} -X github.com/nchungdev/agent-bridge/internal/version.Commit=${GITHUB_SHA}" -o "dist/${name}/agent-bridge" .
          cp README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true

  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3 # the runtime stage (apt-get) runs per target architecture
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agent-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
